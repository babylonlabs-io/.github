name: Audit Workflows (zizmor)

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

permissions: {}

# One group per audit, caller workflow and ref: a new push cancels only the
# superseded run of this same audit. Inside a called workflow github.workflow
# is the caller's name, so the literal keeps this group distinct from the
# caller's own group and from the other audit workflow.
concurrency:
  group: ${{ github.workflow }}-zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Upstream release image, pinned by digest. The digest is the one
      # zizmor-action v0.6.4 ships for 1.30.1 and matches the registry tag
      # (verified 2026-09-22). Bump the tag and the digest together.
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
          # The PR merge commit plus its parents: the base commit (HEAD^1) is
          # where the next step reads zizmor's config from.
          fetch-depth: 2

      # A PR must not waive its own findings. On pull requests the audit reads
      # zizmor's config from the PR's base commit, never from the change under
      # review (no config on the base: --no-config), and a PR that adds an
      # inline `zizmor: ignore` comment fails. A waiver therefore goes into
      # .github/zizmor.yml in a PR of its own and counts once it is merged.
      # Other events (push, merge queue) audit an already merged tree and use
      # its config as zizmor finds it.
      - name: Take zizmor's config from the base commit, reject self-waivers
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=""
          case "${EVENT_NAME}" in
            pull_request|pull_request_target)
              if ! base=$(git rev-parse --verify --quiet 'HEAD^1'); then
                echo "::error::cannot find the PR's base commit (HEAD^1) in the checkout"
                exit 1
              fi
              args="--no-config"
              for f in .github/zizmor.yml .github/zizmor.yaml zizmor.yml zizmor.yaml; do
                if git cat-file -e "${base}:${f}" 2>/dev/null; then
                  git show "${base}:${f}" > "${RUNNER_TEMP}/zizmor-base.yml"
                  args="--config /zizmor-base.yml"
                  echo "zizmor config: ${f} from the base commit ${base:0:12}"
                  break
                fi
              done
              [ "${args}" = "--no-config" ] && echo "zizmor config: none on the base commit; the PR's own config is not used"
              # Only what zizmor honours: an ignore comment (a hash, then
              # `zizmor: ignore[...]`) on an added line of a .yml/.yaml file.
              # Docs may mention the syntax, so other files are not checked.
              added=$(git diff --unified=0 "${base}" HEAD -- '*.yml' '*.yaml' \
                | grep -E '^\+[^+].*#[[:space:]]*zizmor:[[:space:]]*ignore' || true)
              if [ -n "${added}" ]; then
                echo "::error::this PR adds inline zizmor ignore comments. A PR cannot waive its own findings: fix the finding, or add the waiver to .github/zizmor.yml in a PR of its own (it counts once merged)."
                printf '%s\n' "${added}"
                exit 1
              fi
              ;;
          esac
          echo "args=${args}" >> "${GITHUB_OUTPUT}"

      # Audits every workflow, composite action and Dependabot config in the
      # calling repo: template injection, dangerous triggers, excessive
      # permissions, unpinned actions and images, cache poisoning, leaked
      # credentials, known-vulnerable actions. Findings at or above medium
      # severity and medium confidence fail the check. Accepted findings are
      # ignored per repo in .github/zizmor.yml, taken from the base commit on
      # pull requests (previous step).
      # --collect=all also audits files that .gitignore lists (zizmor honours
      # .gitignore by default, GitHub does not: a force-added workflow would
      # run unaudited), and --strict-collection fails on an input zizmor
      # cannot parse instead of skipping it with a warning.
      # GH_TOKEN (read-only on pull_request) is only used by the online audits
      # (known-vulnerable-actions, impostor-commit, typosquat-uses).
      - name: Audit GitHub Actions workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_ARGS: ${{ steps.config.outputs.args }}
        run: |
          set -uo pipefail

          echo "::group::Pull zizmor image"
          docker pull "${ZIZMOR_IMAGE}" || { echo "::error::could not pull ${ZIZMOR_IMAGE}"; exit 1; }
          echo "::endgroup::"

          # The step has no `shell:`, so the runner runs it as `bash -e`: a
          # non-zero exit from docker run would end the step before rc is
          # read, and exit 3 (nothing to audit) would fail it. `|| rc=$?`
          # keeps every exit code for the case below.
          base_config=()
          if [ -f "${RUNNER_TEMP}/zizmor-base.yml" ]; then
            base_config=(--volume "${RUNNER_TEMP}/zizmor-base.yml:/zizmor-base.yml:ro")
          fi

          rc=0
          # base_config may be empty; the ${a[@]+"${a[@]}"} form expands an
          # empty array safely under `set -u`.
          # CONFIG_ARGS is empty, "--no-config" or "--config /zizmor-base.yml"
          # (set by the previous step, never from PR content); unquoted on
          # purpose so it splits into separate arguments.
          # shellcheck disable=SC2086
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            ${base_config[@]+"${base_config[@]}"} \
            --workdir /workspace \
            --env GH_TOKEN \
            "${ZIZMOR_IMAGE}" \
            --persona regular \
            --min-severity medium \
            --min-confidence medium \
            --collect=all \
            --strict-collection \
            ${CONFIG_ARGS} \
            --format github \
            -- . || rc=$?

          case "${rc}" in
            0)
              echo "zizmor: no findings at or above medium severity and medium confidence"
              ;;
            3)
              echo "::warning::zizmor found nothing to audit in this repository (no workflows, actions or dependabot config); passing"
              ;;
            1[0-4])
              echo "::error::zizmor reported findings (exit code ${rc}). Fix them, or add a reviewed ignore for accepted findings to .github/zizmor.yml"
              exit "${rc}"
              ;;
            *)
              echo "::error::zizmor did not complete (exit code ${rc})"
              exit 1
              ;;
          esac
