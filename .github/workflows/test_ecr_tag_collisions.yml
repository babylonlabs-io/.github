name: ECR Publication Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reusable_docker_pipeline.yml'
      - '.github/workflows/test_ecr_tag_collisions.yml'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: ecr-publication-regression-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-ecr-tag-collisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
      - name: Run publication regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          # Python 3, yq v4, and jq are provided by the ubuntu-24.04 image.
          yq --version
          jq --version
          python3 -m unittest discover -s tests -v
