name: Go Releaser

on:
  workflow_call:
    inputs:
      run-releaser:
        description: 'Run releaser'
        type: boolean
        default: true
      timeout_minutes:
        description: 'Job timeout in minutes, like reusable_docker_pipeline. Raise it for unusually long builds.'
        required: false
        type: number
        default: 60

permissions:
  contents: write

jobs:
  goreleaser:
    name: Go Releaser
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    if: ${{ inputs.run-releaser }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0 https://github.com/actions/setup-go/releases/tag/v5.6.0
        with:
          go-version-file: go.mod
      - name: Install GoReleaser
        env:
          GORELEASER_VERSION: v2.20.0
          GORELEASER_SHA256: d2483159e6007f814132cb56635ad30a70013dbeb813d6033a7e01adf6ae108c
        run: |
          set -euo pipefail
          platform="$(uname -s)-$(uname -m)"
          if [ "$platform" != "Linux-x86_64" ]; then
            echo "::error::GoReleaser ${GORELEASER_VERSION} is pinned for Linux-x86_64; this runner is ${platform}"
            exit 1
          fi
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" == *[[:cntrl:]]* ]]; then
            echo "::error::RUNNER_TEMP is not usable"
            exit 1
          fi
          install_dir=$(mktemp -d "$RUNNER_TEMP/goreleaser.XXXXXX")
          archive="$install_dir/goreleaser_Linux_x86_64.tar.gz"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz"
          echo "${GORELEASER_SHA256}  ${archive}" | sha256sum -c --strict -
          tar -xzf "$archive" -C "$install_dir" goreleaser
          chmod 0755 "$install_dir/goreleaser"
          "$install_dir/goreleaser" --version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
